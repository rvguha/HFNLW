# Golden queries (design doc s10.3). Written before retrieval tuning.
#
# Each query states the properties an acceptable result must have (`requires`)
# and, where a keyword search has an obvious failure mode, the near-match it
# should not return (`avoid`). Scoring an emitted corpus needs no hand-labelled
# result list, so the suite survives a rebuild.
#
# Keys available in `requires` / `avoid`: task_any, subject_any, language_any,
# library_any, license_status_any, max_parameters, min_parameters,
# discovery_scope, evidence_type_any, min_confidence, keyword_any.
version: "1.0"
queries:
  # -- domain knowledge -----------------------------------------------------
  - id: q001
    question: I need a small model for biomedical named-entity recognition.
    chat: "We're a small research group annotating clinical trial abstracts and we keep hitting the limits of regex for pulling out drug and gene names. I don't have a big GPU budget — is there something reasonably compact that's actually been trained for biomedical entity extraction rather than just a general model I'd have to fine-tune myself?"
    requires:
      task_any: [token-classification, Named Entity Recognition, Token Classification]
      subject_any: [biomedicine, molecular-biology]
      max_parameters: 1000000000
    avoid:
      keyword_any: [general-purpose chat assistant]

  - id: q002
    question: Which models have documented knowledge of Indian legal material?
    chat: "I'm advising an Indian legal-tech startup and they want to know whether anything off the shelf already understands Indian statutes and case law, or whether everything out there is US-centric and they'd have to train from scratch. What's actually out there?"
    requires:
      subject_any: [law]
      evidence_type_any: [trained_on, fine_tuned_on, evaluated_on]
      keyword_any: [india, indian, hindi, legal]

  - id: q003
    question: Find multilingual embedding models evaluated on non-English retrieval.
    chat: "Our search index covers about a dozen languages and English-only embeddings are clearly hurting recall on the non-English side. I'd want something where someone has actually measured retrieval quality outside English, not just claimed multilingual support. Any suggestions?"
    requires:
      task_any: [feature-extraction, sentence-similarity, Embedding, Sentence Embedding]
      subject_any: [information-retrieval, multilingual-nlp]
      evidence_type_any: [evaluated_on, trained_on, fine_tuned_on]

  - id: q004
    question: I need speech recognition for low-resource African languages.
    chat: "I'm working with a team recording oral histories in Swahili, Yoruba and Hausa. Most ASR I've tried is hopeless on these. Is there anything that genuinely handles low-resource African languages?"
    requires:
      task_any: [automatic-speech-recognition, Speech Recognition]
      language_any: [sw, am, yo, ha, ig, zu, wo, so, rw]

  - id: q005
    question: Which image models have a clearly stated commercially usable license?
    chat: "Our legal team is nervous about what we ship in a commercial product. For image models specifically — generation or classification — which ones have a licence that's clearly stated and unambiguously fine for commercial use? I don't want anything where the terms are vague."
    requires:
      task_any: [text-to-image, image-classification, Image Generation, Image Classification]
      license_status_any: [recognized_identifier]
    avoid:
      license_status_any: [unknown]

  - id: q006
    question: Find a model related to Carnatic music, distinguishing audio generation from
      descriptive text knowledge.
    chat: "A musicologist colleague asked whether any model actually knows Carnatic music. I want to be careful about the distinction: something trained on the audio, or something that just has text knowledge about it — those are very different for her purposes. What exists?"
    requires:
      subject_any: [music]
      evidence_type_any: [trained_on, fine_tuned_on, architecture]
    avoid:
      evidence_type_any: [merely_mentioned]

  - id: q007
    question: What can run locally on an Apple silicon laptop with 16 GB of memory?
    chat: "I've got a MacBook with 16GB and no cloud budget for this project. What can I realistically run locally without it swapping constantly?"
    requires:
      max_parameters: 8000000000

  - id: q008
    question: Which models were trained on protein or genomic sequences?
    chat: "We're a computational biology lab moving into protein language models. Which models were genuinely trained on protein or genomic sequence data, as opposed to general models that happen to mention biology?"
    requires:
      subject_any: [molecular-biology]
      evidence_type_any: [trained_on, fine_tuned_on, architecture]

  - id: q009
    question: Show me models fine-tuned on financial filings or market data.
    chat: "I'm building a tool that reads 10-K filings and earnings transcripts. General-purpose LLMs get the vocabulary wrong. Has anyone fine-tuned something specifically on financial documents or market data?"
    requires:
      subject_any: [finance]
      evidence_type_any: [trained_on, fine_tuned_on]

  - id: q010
    question: Any model with documented chemistry or molecular property prediction training?
    chat: "Our chemistry group wants to predict molecular properties and someone suggested there might be pretrained models rather than us building from scratch. Is there anything with documented training on chemistry data?"
    requires:
      subject_any: [chemistry]
      evidence_type_any: [trained_on, fine_tuned_on, architecture]

  - id: q011
    question: Models for climate, weather, or earth observation data.
    chat: "I work on climate adaptation and we have a lot of satellite and weather data. Are there any models built for earth observation or climate data specifically?"
    requires:
      subject_any: [climate-earth-science]

  - id: q012
    question: Which models are documented for clinical or radiology report understanding?
    chat: "We're a hospital IT team looking at automating parts of radiology reporting. Before we go anywhere near patient data I want to know what's documented for clinical or radiology report understanding. What should I be looking at?"
    requires:
      subject_any: [biomedicine, document-understanding]
      keyword_any: [clinical, radiology, report, patient]

  - id: q013
    question: Find a model specialised in mathematical reasoning with reported evaluation.
    chat: "I'm putting together a maths tutoring product and need a model that's genuinely good at multi-step reasoning, with actual benchmark numbers rather than marketing claims. What's worth evaluating?"
    requires:
      subject_any: [mathematics]
      evidence_type_any: [evaluated_on, trained_on, fine_tuned_on]

  - id: q014
    question: Code models evaluated on program synthesis benchmarks.
    chat: "Our team is building a code assistant and I want to compare options that have been evaluated on real program synthesis benchmarks — HumanEval, MBPP, that sort of thing. Not just models that mention they can write code."
    requires:
      subject_any: [software-engineering]
      evidence_type_any: [evaluated_on]

  - id: q015
    question: Models documented for cybersecurity or malware analysis.
    chat: "I'm on a security team and we're exploring ML for malware triage. Is there anything documented for cybersecurity or malware analysis, or is everyone still rolling their own?"
    requires:
      subject_any: [cybersecurity]

  # -- task and modality ----------------------------------------------------
  - id: q016
    question: A reranking model for improving search result ordering.
    chat: "Our RAG pipeline retrieves 50 candidates and the ordering is poor — the right answer is often at rank 30. I gather a reranker is what I want here. What should I use?"
    requires:
      keyword_any: [rerank, reranker, cross-encoder]
      task_any: [text-ranking, text-classification, feature-extraction, sentence-similarity,
                 Text Classification, Feature Extraction, Sentence Embedding, Reranking]

  - id: q017
    question: Text to speech models that can clone or condition on a reference voice.
    chat: "We're making an audiobook tool and want narration in a specific person's voice from a short reference clip. Which TTS models support voice cloning or conditioning on a reference sample?"
    requires:
      task_any: [text-to-speech, Speech Synthesis, text-to-audio, Audio Generation]
      keyword_any: [voice, speaker, clone, zero-shot]

  - id: q018
    question: Document question answering over scanned invoices and forms.
    chat: "Our finance team processes thousands of scanned invoices a month and I want to ask questions against them directly — 'what's the total on this one', that kind of thing. What handles document QA over scanned forms?"
    requires:
      task_any: [document-question-answering, Document Question Answering,
                 image-text-to-text, Vision Language Modeling]
      subject_any: [document-understanding]

  - id: q019
    question: Object detection models for real time video.
    chat: "I need to run object detection on a live video feed, so latency matters more than squeezing out the last point of accuracy. What's suitable for real-time?"
    requires:
      task_any: [object-detection, Object Detection]

  - id: q020
    question: Diffusion models for image editing rather than generation from scratch.
    chat: "I don't want to generate images from scratch — I have existing photos and want to modify them, inpainting and style changes. Which diffusion models are built for editing rather than text-to-image?"
    requires:
      task_any: [image-to-image, Image To Image]

  - id: q021
    question: Speaker diarization for multi speaker meeting recordings.
    chat: "We record team meetings and the transcripts are useless because everything is one wall of text with no idea who said what. What handles speaker diarization for multi-speaker recordings?"
    requires:
      keyword_any: [diarization, speaker, segmentation]
      task_any: [voice-activity-detection, audio-classification, automatic-speech-recognition,
                 Voice Activity Detection, Audio Classification, Speech Recognition]

  - id: q022
    question: Zero shot text classification without task specific training data.
    chat: "I have a classification problem with maybe 20 categories and no labelled data at all, and no budget to create any. Is zero-shot classification good enough these days, and what would I use?"
    requires:
      task_any: [zero-shot-classification, Zero-Shot Classification]

  - id: q023
    question: Summarization models for long documents.
    chat: "We process research papers and policy documents that run to 50 pages. Most summarizers I've tried choke or just summarize the first page. What actually handles long documents?"
    requires:
      task_any: [summarization, Summarization, text2text-generation, Text Generation]
      keyword_any: [summar, long, document]

  - id: q024
    question: Video understanding models that answer questions about a clip.
    chat: "I want to ask questions about video clips — 'what happens after the person picks up the box' — not just classify or caption them. What models do video understanding with QA?"
    requires:
      task_any: [video-text-to-text, Video Understanding, video-classification,
                 Video Classification]

  - id: q025
    question: Translation models between two specific non English languages.
    chat: "We need translation between Portuguese and Japanese directly, not routed through English, because the quality loss is obvious. Are there models for specific non-English pairs?"
    requires:
      task_any: [translation, Machine Translation]

  # -- language coverage ----------------------------------------------------
  - id: q026
    question: Models supporting Indian languages such as Hindi, Tamil, or Telugu.
    chat: "We're launching in India and need to support Hindi, Tamil and Telugu properly. What's actually good for Indian languages rather than just listing them in the tags?"
    requires:
      language_any: [hi, ta, te, bn, mr, kn, ml, gu, pa, ur]

  - id: q027
    question: Chinese language models with documented Chinese evaluation.
    chat: "I need a Chinese language model where someone has actually published Chinese evaluation results — CLUE or similar — rather than an English model with some Chinese in the training mix."
    requires:
      language_any: [zh]

  - id: q028
    question: Arabic language understanding models.
    chat: "We're building customer support tooling for the Gulf region. What's genuinely good at Arabic language understanding?"
    requires:
      language_any: [ar]

  - id: q029
    question: Southeast Asian language models covering Indonesian, Thai, or Vietnamese.
    chat: "Our product is expanding into Southeast Asia — Indonesian, Thai and Vietnamese. What models cover those languages well?"
    requires:
      language_any: [id, th, vi, ms, tl]

  - id: q030
    question: European language models beyond English, for example Finnish or Czech.
    chat: "We need European language coverage beyond the big five — things like Finnish and Czech that usually get neglected. What's out there?"
    requires:
      language_any: [fi, cs, hu, pl, ro, bg, el, da, sv, no, nl, ca, eu]

  # -- deployability --------------------------------------------------------
  - id: q031
    question: Something under a billion parameters I can fine tune on one GPU.
    chat: "I have a single A100 and want to fine-tune on my own data. Realistically that means staying under a billion parameters, I think. What are my options?"
    requires:
      max_parameters: 1000000000

  - id: q032
    question: A large frontier scale open weights model.
    chat: "We have serious compute and want to evaluate the largest open-weights models available — frontier scale, not the small stuff. What should be on the list?"
    requires:
      min_parameters: 30000000000

  - id: q033
    question: Quantized builds of a model I can run on a laptop.
    chat: "I want to run something decent on my laptop, which means a quantized build — GGUF or similar. What's available?"
    requires:
      keyword_any: [quantized, quantization, gguf, awq, gptq, bitsandbytes, 4-bit, 8-bit, int8,
                    int4, nf4]
      max_parameters: 15000000000

  - id: q034
    question: A model with a long context window for whole document input.
    chat: "We feed entire contracts into the model, sometimes 100 pages. Short context windows mean chunking and losing cross-references. What has a genuinely long context window?"
    requires:
      keyword_any: [context, long, 128k, 32k]
      task_any: [text-generation, Text Generation]

  - id: q035
    question: ONNX or OpenVINO builds for CPU only deployment.
    chat: "We're deploying to CPU-only servers, no GPUs available. I gather ONNX or OpenVINO builds are what I want. What's available in those formats?"
    requires:
      keyword_any: [onnx, openvino, cpu]

  - id: q036
    question: Sentence transformers models I can run with the sentence-transformers library.
    chat: "Our stack already uses the sentence-transformers library and I'd rather not rewrite the loading code. What models work directly with it?"
    requires:
      library_any: [sentence-transformers]

  # -- licensing and governance ---------------------------------------------
  - id: q037
    question: Apache 2.0 or MIT licensed language models.
    chat: "Legal wants everything under a permissive licence — Apache 2.0 or MIT, nothing custom. Which language models qualify?"
    requires:
      license_status_any: [recognized_identifier]
      task_any: [text-generation, Text Generation]
    avoid:
      license_status_any: [unknown, declared_text]

  - id: q038
    question: Models whose license terms I would need to read before commercial use.
    chat: "I want the opposite of the usual question: which models have licence terms I'd actually need a lawyer to read before shipping commercially? I want to know what to avoid."
    requires:
      license_status_any: [declared_text, declared_link, unknown]

  - id: q039
    question: Models that document their limitations and known risks.
    chat: "For our model governance process I need to document known risks. Which models have actually written up their own limitations rather than leaving that section empty?"
    requires:
      has_limitations: true

  - id: q040
    question: Models with a stated training dataset I can inspect.
    chat: "Our compliance review requires knowing what a model was trained on. Which ones state their training dataset in a way I could actually go and inspect?"
    requires:
      evidence_type_any: [trained_on, fine_tuned_on]

  # -- misleading near-matches ----------------------------------------------
  - id: q041
    question: Models that actually know about molecular biology, not ones that merely cite a
      biology benchmark.
    chat: "I need a model that genuinely knows molecular biology — trained on it, not one that just happens to cite a biology benchmark in a results table. That distinction matters for what we're doing."
    requires:
      subject_any: [molecular-biology, biomedicine]
      evidence_type_any: [trained_on, fine_tuned_on, architecture]
      min_confidence: medium
    avoid:
      evidence_type_any: [merely_mentioned]

  - id: q042
    question: A legal domain model, not a general chat model that mentions legal disclaimers.
    chat: "I want an actual legal domain model. Not a general chat model that happens to mention legal disclaimers or has 'law' somewhere in its README."
    requires:
      subject_any: [law]
      evidence_type_any: [trained_on, fine_tuned_on, evaluated_on]
    avoid:
      evidence_type_any: [merely_mentioned]

  - id: q043
    question: The original base model rather than one of its repackaged quantizations.
    chat: "I keep finding quantized repackagings when what I want is the original base model from the people who trained it. How do I find the real one?"
    requires:
      discovery_scope: primary
    avoid:
      discovery_scope: variant

  - id: q044
    question: A speech model for African languages rather than a model that lists Africa in its
      training corpus description only.
    chat: "I need a speech model genuinely built for African languages — trained or evaluated on them — not one that just lists Africa somewhere in a training corpus description."
    requires:
      task_any: [automatic-speech-recognition, Speech Recognition, text-to-speech,
                 Speech Synthesis]
      language_any: [sw, am, yo, ha, ig, zu, wo, so, rw, xh, st, tn, ny, sn, lg, ln, ff, om, ti]
      evidence_type_any: [trained_on, fine_tuned_on, evaluated_on]

  - id: q045
    question: An education focused model with documented instructional use.
    chat: "We build classroom tools and want a model with documented educational use, ideally something evaluated on instructional tasks rather than repurposed."
    requires:
      subject_any: [education]
      evidence_type_any: [intended_for, trained_on, fine_tuned_on]


  # -- known-item lookup ------------------------------------------------------
  # The category the flat retrieval blob was worst at: the user already knows
  # which model they want and types its name. Gold is the single named
  # repository, so these are unambiguous and need no judge. Phrasings vary the
  # way real queries do -- display name, repo id, hyphenated form, org plus
  # short name, and a natural sentence around the name.
