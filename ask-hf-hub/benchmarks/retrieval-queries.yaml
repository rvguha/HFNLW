  # -- narrow task and constraint --------------------------------------------
  # Deliberately narrower than the broad category queries above, whose gold sets
  # run to thousands of records and so cannot separate one ranking from another.
  - id: q086
    question: A model that detects the language of a piece of text.
    chat: "We ingest user-submitted text from all over the world and need to route it to the right downstream pipeline. Before anything else I need to know what language each piece of text is in. What model does that reliably across many languages?"
    requires: {task_any: [text-classification, Text Classification],
               keyword_any: [language identification, language detection, langid]}
  - id: q087
    question: Grammatical error correction for English writing.
    chat: "I'm building a writing assistant for non-native English speakers. It needs to catch grammar mistakes and suggest corrections, not just flag them. What's available?"
    requires: {keyword_any: [grammatical error correction, grammar correction, gec]}
  - id: q088
    question: A model that converts speech to text in Vietnamese.
    chat: "We're transcribing Vietnamese customer service calls. Note I want speech going to text, not the other way round — I keep finding TTS models when I search. What handles Vietnamese ASR?"
    requires: {task_any: [automatic-speech-recognition, Speech Recognition],
               language_any: [vi]}
  - id: q089
    question: Depth estimation from a single image.
    chat: "I have single photographs and need to estimate how far away things are — depth from one image, no stereo pair, no LiDAR. What models do monocular depth?"
    requires: {keyword_any: [depth estimation, monocular depth, depth anything]}
  - id: q090
    question: Optical character recognition for handwritten text.
    chat: "We're digitising handwritten archival records — census forms, letters. Printed-text OCR fails completely on these. What handles handwriting?"
    requires: {keyword_any: [handwritten, handwriting, htr, trocr]}
  - id: q091
    question: A model for detecting toxic or hateful comments.
    chat: "We moderate a community forum and need to flag abusive or hateful comments before a human reviews them. What's actually good at toxicity detection?"
    requires: {task_any: [text-classification, Text Classification],
               keyword_any: [toxic, toxicity, hate speech, offensive]}
  - id: q092
    question: Emotion recognition from speech audio.
    chat: "For a call-centre analytics product I want to detect how the speaker sounds — angry, frustrated, calm — from the audio itself rather than the transcript. What does speech emotion recognition?"
    requires: {task_any: [audio-classification, Audio Classification],
               keyword_any: [emotion, emotional, ser]}
  - id: q093
    question: A small Japanese language model I can run locally.
    chat: "I want to run a Japanese language model on my own machine, so it has to be small — a couple of billion parameters at most. What are the options?"
    requires: {language_any: [ja], max_parameters: 3000000000}
  - id: q094
    question: Image segmentation models for medical scans.
    chat: "Our radiology group wants to segment organs and lesions in CT and MRI scans. General-purpose segmentation models don't seem to transfer well. What's built for medical imaging?"
    requires: {keyword_any: [segmentation],
               subject_any: [medicine, biomedicine, radiology, healthcare]}
  - id: q095
    question: A model that generates SQL from a natural language question.
    chat: "We want non-technical staff to ask questions of our database in plain English and have it turned into SQL. What models handle text-to-SQL?"
    requires: {keyword_any: [text-to-sql, text to sql, sql generation, spider]}
  - id: q096
    question: Turkish sentiment analysis.
    chat: "We're analysing Turkish product reviews for sentiment. Multilingual models are mediocre on Turkish in my experience. Is there anything Turkish-specific?"
    requires: {language_any: [tr], keyword_any: [sentiment]}
  - id: q097
    question: A GGUF build I can load in llama.cpp.
    chat: "I run everything through llama.cpp on my own hardware, so I need a GGUF build rather than safetensors. What's available in that format?"
    requires: {keyword_any: [gguf, llama.cpp, llama cpp]}
  - id: q098
    question: Models that generate music or audio from a text prompt.
    chat: "I'm scoring a short film and want to generate background music from a text description of the mood. What models generate music or audio from a prompt?"
    requires: {task_any: [text-to-audio, text-to-music, Audio Generation],
               keyword_any: [music, audio, sound]}
  - id: q099
    question: A vision language model small enough for edge deployment.
    chat: "We're putting a vision-language model on edge devices with limited memory, so it has to be genuinely small — a few billion parameters at most — while still handling images and text together. What fits?"
    requires: {task_any: [image-text-to-text, visual-question-answering,
                          Visual Question Answering],
               max_parameters: 4000000000}
  - id: q100
    question: Named entity recognition for German text.
    chat: "We process German legal correspondence and need to extract names of people, organisations and places. What does named entity recognition for German?"
    requires: {task_any: [token-classification, Token Classification],
               language_any: [de]}
