[project]
name = "ask-hf-hub"
version = "0.1.0"
description = "An NLWeb ask interface over a grounded schema.org catalog of Hugging Face models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "numpy>=1.26,<3",
  "openai>=1.40,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "starlette>=0.40,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
ask-hf-hub = "askhub.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
askhub = ["corpus/*.jsonl", "corpus/*.json", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
